<script id="curated-data" type="application/json">{"nodes":[{"id":"shanhe","parent":null,"title":"山河志","type":"档案分类","intro":"地理、制度、民生、武学与医药分项查阅。","facts":[],"sources":[]},{"id":"geography","parent":"shanhe","title":"地理图志","type":"地理","intro":"从王朝到州县，逐层查阅地点。","facts":[],"sources":[]},{"id":"dayu","parent":"geography","title":"大豫","type":"王朝","intro":"雍州、云州是目前已确认的两处州域。完整疆域与其余州县尚未设定。","facts":[["区划","正式行政为州、县两级；镇、村等纳入所属县。"]],"sources":["putixue-git/docs/world/大豫.md","putixue-git/docs/world/地方行政制度.md"]},{"id":"yong","parent":"dayu","title":"雍州","type":"州","intro":"中央直辖的核心地区，上京坐落其境内。","facts":[["相对位置","云州位于雍州以南，两州接壤。"]],"sources":["putixue-git/docs/world/大豫地理与交通.md"]},{"id":"yun","parent":"dayu","title":"云州","type":"州","intro":"由朝廷直接管理，已知辖章台县、六阳县。","facts":[["相对位置","章台、六阳在云州南部，离雍州较远。"],["称谓","“云州府”指知州及州级官署，不另设府一级行政区。"]],"sources":["putixue-git/docs/world/云州府.md","putixue-git/docs/world/大豫地理与交通.md"]},{"id":"dongwang","parent":"yong","title":"东望县","type":"县","intro":"位于上京外围，临江驿是其辖下的水运节点。","facts":[["地名来历","往昔江上蜃景映出上京城楼，“东望”之名由此而来。"],["距离","与上京的精确里程未设定。"]],"sources":["kelai_git/06_世界与地点.md"]},{"id":"shangjing","parent":"yong","title":"上京","type":"都城","intro":"大豫都城，位于雍州。其县级归属尚未设定，暂列于州内。","facts":[["城内","萧无名曾在此任京兆府稽查司捕头。"]],"sources":["putixue-git/docs/world/上京.md"],"unassigned":true},{"id":"zhangtai","parent":"yun","title":"章台县","type":"县","intro":"位于六阳以北，苍岩岭横在两县之间。","facts":[["地方概况","周叙曾任知县；其任内早期流民境况相对较好。"]],"sources":["putixue-git/docs/world/章台县.md","putixue-git/docs/world/大豫地理与交通.md"]},{"id":"liuyang","parent":"yun","title":"六阳县","type":"县","intro":"位于章台以南，以药业和御供药田相关历史见于故事。","facts":[["地貌","六阳川及苍岩岭构成相关地理背景。"],["药业","旧案后的重税使药市衰败。"]],"sources":["putixue-git/docs/world/六阳县.md"]},{"id":"cangyan","parent":"yun","title":"苍岩岭","type":"跨县山川","intro":"横在章台、六阳两县之间，东部地势险峻。具体县界未设定，作为跨县地点收于云州。","facts":[["关联地点","栖云谷、一线天与白衣军隐蔽营地位于这一带。"]],"sources":["putixue-git/docs/world/苍岩岭.md"],"shared":true},{"id":"linjiang","parent":"dongwang","title":"临江驿","type":"镇与驿站","intro":"东望县辖下的重要水运港口与驿站节点。","facts":[["往来","商旅、江湖人、官员和逃难者在这里交汇。"]],"sources":["kelai_git/06_世界与地点.md"]},{"id":"tingyun","parent":"dongwang","title":"停云客栈","type":"客栈","intro":"位于临江驿，可观汶泽江景，但不紧贴码头。","facts":[["经营","掌柜兰栀宁；中端消费，环境较好，价格略高。"],["客群","商人、江湖人、文人及游历采风者。"]],"sources":["kelai_git/06_世界与地点.md"]},{"id":"wenze","parent":"dongwang","title":"汶泽江 · 临江驿段","type":"河段","intro":"临江驿所临的水运河道，是上京外围的重要港口水域。","facts":[["景观","江上雾气中的城楼影像是自然海市蜃楼。"],["范围","此条仅收录临江驿段，不把整条江归入东望县。"]],"sources":["kelai_git/06_世界与地点.md","kelai_git/11_大豫共享世界观.md"]},{"id":"hejing","parent":"zhangtai","title":"鹤径村","type":"村落","intro":"章台郊村，柳彦与柳慈音曾在此生活、行医三年。","facts":[["人物经历","柳慈音十三岁被掳前的家。"]],"sources":["putixue-git/docs/world/鹤径村.md"]},{"id":"jingxin","parent":"zhangtai","title":"静心庵","type":"庵堂","intro":"章台郊外山脚的小庵，柳慈音曾借住。","facts":[["人员","住持与两名小徒生活于此。"],["后续","柳慈音离开后的庵中近况尚未展开。"]],"sources":["putixue-git/docs/world/静心庵.md"]},{"id":"linxi","parent":"liuyang","title":"临溪坊","type":"街坊","intro":"位于六阳城南，苏宅所在，也是慢性怪病发生的区域。","facts":[["环境线索","苏宅井中发现凌铅矿。"]],"sources":["putixue-git/docs/world/临溪坊与旧水道.md"]},{"id":"oldwater","parent":"liuyang","title":"西北旧水道","type":"旧设施","intro":"六阳西北的旧水道，曾藏有濒死流民。","facts":[["区别","这里的流民病症与城南临溪坊的慢性怪病不同。"]],"sources":["putixue-git/docs/world/临溪坊与旧水道.md"]},{"id":"shunan","parent":"liuyang","title":"顺安客栈","type":"客栈","intro":"兰家经营的客栈，兰栀宁曾在父亲不在时暂掌营生。","facts":[["用途","柳慈音、萧无名在六阳停留时的据点。"]],"sources":["putixue-git/docs/world/顺安客栈与保元堂.md","putixue-git/docs/factions/兰家商队.md"]},{"id":"baoyuan","parent":"liuyang","title":"保元堂","type":"药铺","intro":"六阳药铺，柳慈音与萧无名由此寻找米大夫、林远志。","facts":[],"sources":["putixue-git/docs/world/顺安客栈与保元堂.md"]},{"id":"liuyang-office","parent":"liuyang","title":"六阳县衙","type":"官署","intro":"县中处理日常政务的官署。","facts":[["近况 · 菩提雪","白衣军控制要地后，县衙日常事务由吴典史继续料理；长期治理安排尚未明确。"]],"sources":["putixue-git/docs/factions/白衣军.md"]},{"id":"pujue","parent":"shangjing","title":"普觉寺","type":"寺院","intro":"京郊寺院，是覆雨楼名义上的通信联系点。","facts":[["归属","所在县未设定。"]],"sources":["putixue-git/docs/world/上京.md"]},{"id":"manors","parent":"shangjing","title":"京郊庄园","type":"庄园","intro":"京郊存在与白骨案、覆雨楼活动相关的隐秘庄园。","facts":[["辨别","白骨案庄园与训练庄园不能直接视作同一处。"],["归属","所在县及两处庄园的具体关系未定。"]],"sources":["putixue-git/docs/world/上京.md"]},{"id":"qiyun","parent":"cangyan","title":"栖云谷","type":"山谷","intro":"苍岩岭区域内的白衣军主营，安置军属与流民。","facts":[["谷内","已辟耕地与屋舍，另有梯田、药庐、冰窖、工坊。"],["通道","通过一线天连接车马营。"]],"sources":["putixue-git/docs/world/栖云谷.md"]},{"id":"yixiantian","parent":"cangyan","title":"一线天","type":"山间通道","intro":"栖云谷与车马营之间的通道。","facts":[["方位","在苍岩岭东侧；相对栖云谷局部住所也可描述为东边。"]],"sources":["putixue-git/docs/world/栖云谷.md"]},{"id":"institutions","parent":"shanhe","title":"王朝制度","type":"制度","intro":"政权、行政与军事各自成类。","facts":[],"sources":[]},{"id":"central","parent":"institutions","title":"中央政制","type":"政制","intro":"大豫中央权力与日常政务的组织方式。","facts":[],"sources":[]},{"id":"throne","parent":"central","title":"皇位与摄政","type":"皇权","intro":"《菩提雪》时期，幼帝亓官羿在位，太后温明姝监国，亓官鸿依遗诏摄政并掌握朝政实权。","facts":[["未定","遗诏是否存在伪造或操纵，尚未明确。"]],"sources":["putixue-git/docs/world/王朝与中央权力.md"]},{"id":"ministries","parent":"central","title":"六部","type":"行政","intro":"六部各理日常政务，尚书为主要长官。","facts":[["人事与财赋","吏部负责人事；户部负责户籍、赋税和财政。"],["礼法与营造","礼部负责礼仪、科举及典章；刑部负责刑律与司法行政；工部负责工程、水利和营造。"],["军事行政","兵部管理军事行政和武官事务，不自动拥有正规军统兵权。"]],"sources":["putixue-git/docs/world/王朝与中央权力.md"]},{"id":"council","parent":"central","title":"议政中枢","type":"议政","intro":"专门议政重臣组成常设中枢，协调重大国策及跨部门事务。","facts":[["人员","六部尚书不因官职自动成为常任议政成员。"],["未定","中枢正式名称、人数和具体程序未定。"]],"sources":["putixue-git/docs/world/王朝与中央权力.md"]},{"id":"local","parent":"institutions","title":"地方行政","type":"行政","intro":"州与县为正式行政层级，镇、村等属于县下基层。","facts":[["州","长官知州，官署州府。"],["县","长官知县，官署县衙。"],["任命","地方行政官原则上由朝廷任命。"]],"sources":["putixue-git/docs/world/地方行政制度.md","putixue-git/docs/world/分封与削藩.md"]},{"id":"military","parent":"institutions","title":"军事与治安","type":"军政","intro":"地方治安力量、朝廷正规军与藩王军队分开理解。","facts":[],"sources":[]},{"id":"policing","parent":"military","title":"州县治安","type":"治安","intro":"知州可调用府兵，知县掌握一定县级武装与衙役力量。","facts":[["职责","巡逻、缉捕、看守及维持地方秩序。"],["区别","不能把这些力量直接等同于朝廷正规野战军。"]],"sources":["putixue-git/docs/world/军事与地方治安.md"]},{"id":"regular","parent":"military","title":"正规驻军","type":"军队","intro":"各州正规驻军由专门武将统领，知州、知县不能随意指挥。","facts":[["调遣","大规模调遣原则上须中央批准；紧急时将领可临机处置，事后上报。"]],"sources":["putixue-git/docs/world/军事与地方治安.md"]},{"id":"princes","parent":"military","title":"分封与削藩","type":"分封","intro":"开国已有分封制度，后期部分藩王逐渐割据。","facts":[["权限","藩王享有一定军事自治权及部分封地税收。"],["时期 · 菩提雪","亓官鸿推行削藩；并非雍州之外都归藩王控制。"]],"sources":["putixue-git/docs/world/分封与削藩.md"]},{"id":"livelihood","parent":"shanhe","title":"民生风物","type":"社会","intro":"经济、文化与出行分开收录。","facts":[],"sources":[]},{"id":"economy","parent":"livelihood","title":"生计与赋税","type":"经济","intro":"王朝后期，土地兼并、军费增加、地方腐败及灾荒相互叠加，使百姓负担加重。","facts":[["进程","危机长期累积，并非开国以来始终如此。"],["留白","具体税种、税率、币制和徭役制度尚未设定。"]],"sources":["putixue-git/docs/world/社会经济与税政.md"]},{"id":"belief","parent":"livelihood","title":"礼俗与信仰","type":"文化","intro":"社会文化参考中国传统古代生活，可有佛道信仰、祭祖及民间鬼神传闻。","facts":[["世界规则","共享世界不存在真实的鬼神、法术、通灵或神迹。"],["留白","具体节日制度及教派历史尚未设定。"]],"sources":["putixue-git/docs/world/社会文化与民间信仰.md"]},{"id":"travel","parent":"livelihood","title":"行旅与交通","type":"交通","intro":"车马、水运与步行共同构成行旅方式。","facts":[["参考行程","上京至章台，普通车马约一至两个月，步行约两至三个月；仅为可变的写作参考。"],["继续南行","前往六阳须在章台一带后继续向南，不能与上京至章台等同。"]],"sources":["putixue-git/docs/world/大豫地理与交通.md"]},{"id":"martial","parent":"shanhe","title":"江湖武学","type":"武学","intro":"传统武侠中的力量与江湖秩序。","facts":[],"sources":[]},{"id":"martial-rules","parent":"martial","title":"内力与技艺","type":"能力","intro":"存在内力、轻功、点穴、兵器与师承。","facts":[["强弱","由修为、经验、招式、兵器及临场条件共同体现，没有统一等级。"],["局限","轻功并非飞行，内力并非法术；高手仍会疲惫、受伤、中毒或死亡。"]],"sources":["putixue-git/docs/world/江湖与武学体系.md"]},{"id":"martial-law","parent":"martial","title":"门派与律法","type":"江湖秩序","intro":"门派、帮会与独行武者有自身传承和规矩，但仍受大豫律法约束。","facts":[["日常","正常习武、收徒不自动违法。"],["边界","杀人、劫掠或谋反可被官府追查；当权者也可能滥用司法打压门派。"]],"sources":["putixue-git/docs/world/江湖与武学体系.md"]},{"id":"medicine","parent":"shanhe","title":"医术药理","type":"医药","intro":"整理医者技艺与小说中的药毒规则。","facts":[],"sources":[]},{"id":"healing","parent":"medicine","title":"医术","type":"技艺","intro":"银针、药膏、清创与缝合等技艺可用于救治伤病。","facts":[["传承","柳慈音的医术承自柳彦，关湛亦参与重伤诊治。"],["局限","医者知识各有边界，不存在通晓所有毒药或无限疗伤的能力。"]],"sources":["putixue-git/docs/world/medical-system.md"]},{"id":"poisons","parent":"medicine","title":"奇药与毒物","type":"药理","intro":"武侠奇药和毒物可以具有特殊效果，仍须有适用条件与代价。","facts":[["区别","中毒、疾病与邪祟传说须分开理解。"],["生死","特殊救治不等于起死回生。"]],"sources":["putixue-git/docs/world/medical-system.md","putixue-git/docs/world/社会文化与民间信仰.md"]},{"id":"factions","parent":null,"title":"势力志","type":"势力","intro":"按组织性质查阅，每个条目分开收录。","facts":[],"sources":[]},{"id":"court-group","parent":"factions","title":"朝堂","type":"朝堂","intro":"王朝政治力量。","facts":[],"sources":[]},{"id":"court","parent":"court-group","title":"大豫朝廷","type":"政权","intro":"《菩提雪》时期摄政王派占优势，太后派仍有政治基础，也存在中立与观望的官员。","facts":[["人物","幼帝亓官羿、太后温明姝、摄政王亓官鸿。"],["区别","朝廷并非意志与知情范围完全一致的整体。"]],"sources":["putixue-git/docs/factions/朝廷.md"]},{"id":"army-group","parent":"factions","title":"军伍","type":"军伍","intro":"军事组织与其活动。","facts":[],"sources":[]},{"id":"whitearmy","parent":"army-group","title":"白衣军","type":"起义军","intro":"起于云州旱灾中的百姓自救，由白靖珩统领。","facts":[["组织","副将、军师、大管家分理事务，另有军医署与工坊。"],["菩提雪时期","曾以栖云谷为隐蔽主营，后公开控制章台、六阳要地并恢复初步秩序。"],["客来时期 · 设定","继续发展，向上京推进；兰栀宁在东望县经营情报节点。"]],"sources":["putixue-git/docs/factions/白衣军.md","kelai_git/11_大豫共享世界观.md"]},{"id":"jianghu-group","parent":"factions","title":"江湖组织","type":"江湖","intro":"组织身份与时代变化。","facts":[],"sources":[]},{"id":"fuyulou","parent":"jianghu-group","title":"覆雨楼","type":"秘密组织","intro":"《菩提雪》时期由亓官鸿私下控制的秘密杀手组织，并非朝廷公开机构。","facts":[["运作","单线联络，任务层层传递，执行者不掌握完整政治目的。"],["编序","按人物证词，天地玄黄：天字一人、地字七人、玄字十四人，黄字不限。"],["客来时期 · 设定","组织已经覆灭，幸存者仍可能出现。"]],"sources":["putixue-git/docs/factions/覆雨楼.md","kelai_git/11_大豫共享世界观.md"]},{"id":"school","parent":"jianghu-group","title":"第五安师门","type":"门派","intro":"传承百年、规模较大的江湖门派，重视专心习武与追求武学巅峰。","facts":[["经历 · 客来设定","第五安在师门繁盛时主动离开；后来门派受政治打压，最终解体。"],["留白","门派名称、掌门与完整武学体系尚未设定。"]],"sources":["kelai_git/04_第五安与师门姐姐线.md"]},{"id":"family-group","parent":"factions","title":"家族与商行","type":"家族","intro":"家族背景与商贸组织。","facts":[],"sources":[]},{"id":"liufamily","parent":"family-group","title":"上京柳氏","type":"望族","intro":"书香望族，祖上为开国元勋。","facts":[["关联","常玉茹称柳彦出自上京柳氏。"],["辨别","柳慈音对外所称的远房旁支是掩护身份，非已证血缘。"]],"sources":["putixue-git/docs/factions/上京柳氏.md"]},{"id":"lantrade","parent":"family-group","title":"兰家商队","type":"商行","intro":"兰家经营顺安客栈与骡马行，兰栀宁曾代父维持营生。","facts":[["经历","兰守谦的商队被山匪囚禁，获白衣军救助后有幸存者留谷帮工。"]],"sources":["putixue-git/docs/factions/兰家商队.md"]},{"id":"sufamily","parent":"family-group","title":"苏家","type":"药商家族","intro":"与六阳御供药材相关，苏长青、王菀之与女儿苏念安为核心家庭。","facts":[["旧案","家族卷入旧案并遭灭门；被记录为潜逃或涉及贪墨，不等于罪名已被证实。"]],"sources":["putixue-git/docs/factions/苏家.md"]},{"id":"changlin","parent":"family-group","title":"常家与林家","type":"药商家族","intro":"六阳旧日御供药商，与苏家共同卷入贪墨案。","facts":[["家族内部","存在主家与旁支，不能将所有成员视作行为一致的整体。"],["辨别","不因亲族关系就认定常玉茹、林远志等人为贪墨共犯。"]],"sources":["putixue-git/docs/factions/常家与林家.md"]},{"id":"chronicles","parent":null,"title":"纪事","type":"纪事","intro":"历史、正文事件与未来规划分栏查看。","facts":[],"sources":[]},{"id":"history","parent":"chronicles","title":"旧事沿革","type":"历史","intro":"发生于主线之前的历史脉络。","facts":[],"sources":[]},{"id":"founding","parent":"history","title":"大豫立国","type":"历史","intro":"王朝建立约三百年，开国已有分封制度。","facts":[["年月","具体开国年月尚未确定。"]],"sources":["putixue-git/docs/timeline/historical-events.md"]},{"id":"su-family-case","parent":"history","title":"苏家旧案","type":"历史","intro":"承平九年四月十八日亥时，六阳苏宅失火。官府案牍记载“无伤亡”，须与苏家遇害的回忆和证词对读。","facts":[["案牍日期","承平九年四月十八日亥时"],["记录性质","“无伤亡”为案牍记载，不等于旧案没有死者。"]],"sources":["putixue-git/docs/chapters/028.md#p001","putixue-git/docs/chapters/045.md#p055","用户确认：承平九年至元启七年相隔十二年"]},{"id":"late-emperor-death","parent":"history","title":"先皇驾崩与幼帝即位","type":"历史","intro":"承平十四年，先皇驾崩，幼帝亓官羿即位。亓官鸿依先皇遗诏取得摄政名分并正式掌握朝政实权，温明姝承担监国职责。","facts":[["纪年","承平十四年；具体月日未定。"],["同期事件","柳慈音十三岁，与柳彦落入覆雨楼控制。"],["确认依据","结合承平九年旧案距主线十二年、当前元启七年推算，已由作者确认。"],["未定事项","遗诏是否被操纵或伪造、形成过程尚未确定。"]],"sources":["putixue-git/docs/timeline/historical-events.md","putixue-git/docs/world/王朝与中央权力.md","用户确认：先皇驾崩于承平十四年，次年改元"]},{"id":"yuanqi-era","parent":"history","title":"改元元启","type":"历史","intro":"承平十四年先皇驾崩、幼帝即位，次年改元元启。当前《菩提雪》正文时代为元启七年。","facts":[["纪年","元启元年；具体月日未定。"],["纪年衔接","承平十四年 → 元启元年 → 元启七年。"]],"sources":["putixue-git/docs/world/王朝与中央权力.md","用户确认：幼帝即位次年改元元启"]},{"id":"drought","parent":"history","title":"云州旱灾","type":"历史","intro":"《菩提雪》主线五年前，云州发生大旱；白靖珩筹粮赈济，百姓自救逐渐发展为白衣军。","facts":[],"sources":["putixue-git/docs/timeline/historical-events.md"]},{"id":"valley-settlement","parent":"history","title":"进入苍岩岭","type":"历史","intro":"《菩提雪》主线三年前，白衣军进入苍岩岭，开始建设栖云谷。","facts":[],"sources":["putixue-git/docs/timeline/historical-events.md"]},{"id":"putixue-events","parent":"chronicles","title":"菩提雪 · 正文事件","type":"正文","intro":"只归纳已发生的事件。","facts":[],"sources":[]},{"id":"save-xiao","parent":"putixue-events","title":"章台相逢","type":"正文","intro":"柳慈音借住静心庵时救下遭追杀的萧无名，两人经试探后有条件地合作。","facts":[],"sources":["putixue-git/docs/plot/main-plot.md"]},{"id":"investigation","parent":"putixue-events","title":"六阳追查","type":"正文","intro":"二人来到六阳，追查逐渐连接京郊白骨、贪墨案、苏家灭门与临溪坊怪病。","facts":[["进展","柳慈音找回苏念安的身份；旧案责任和柳彦下落仍未查清。"]],"sources":["putixue-git/docs/plot/main-plot.md"]},{"id":"south-gate","parent":"putixue-events","title":"六阳南门","type":"正文","intro":"柳慈音为兰栀宁母女迎战荆如梦。白衣军介入，救出母女并以军阵擒获荆如梦。","facts":[],"sources":["putixue-git/docs/relationships/荆如梦-兰栀宁.md","putixue-git/docs/factions/白衣军.md"]},{"id":"clinic","parent":"putixue-events","title":"医舍重开","type":"正文","intro":"柳慈音逐渐恢复接诊，萧无名陪诊并维持候诊秩序，白衣军提供固定场所与药材。","facts":[["身体状态","能够行医不等于身心完全康复。"]],"sources":["putixue-git/docs/factions/白衣军.md","putixue-git/docs/characters/柳慈音.md"]},{"id":"kelai-events","parent":"chronicles","title":"客来 · 后续规划","type":"作者规划","intro":"尚无已定稿正文，不作为已发生事件。","facts":[],"sources":[]},{"id":"later-era","parent":"kelai-events","title":"后作时代","type":"作者规划","intro":"故事设在《菩提雪》结局五年后，摄政王已倒台、覆雨楼已覆灭。","facts":[["纪年","具体年号与事件年月尚未确定。"]],"sources":["kelai_git/03_兰栀宁.md","kelai_git/11_大豫共享世界观.md"]},{"id":"inn-node","parent":"kelai-events","title":"停云布点","type":"作者设定","intro":"兰栀宁主动来到临江驿，经营停云客栈并开展情报工作。","facts":[],"sources":["kelai_git/03_兰栀宁.md"]},{"id":"works","parent":null,"title":"作品","type":"作品","intro":"作品概况与结构。","facts":[],"sources":[]},{"id":"putixue-book","parent":"works","title":"菩提雪","type":"作品","intro":"柳慈音与萧无名从章台相逢，沿六阳旧案追寻身世、寻师与政治谜团。","facts":[["结构","章台、六阳、白衣军三个分卷阶段；第三卷仍在推进。"],["进度","本次整理所据档案更新至第77章相关状态。"]],"sources":["putixue-git/docs/plot/main-plot.md","putixue-git/docs/characters/柳慈音.md"]},{"id":"kelai-book","parent":"works","title":"客来","type":"作品","intro":"《菩提雪》之后的第二部，以临江驿的停云客栈为中心，组织为七个单元。","facts":[["主角","兰栀宁与第五安的相处及关系推进为全书主线。"],["阶段","正式正文尚未开始，现有内容为作者设定和规划。"]],"sources":["kelai_git/01_项目总览与作者层总纲.md","kelai_git/00_资料边界与正文当前状态.md"]}],"relationships":[{"people":[4,5],"tag":"菩提雪 · 正文","title":"柳慈音与萧无名","intro":"由救治与试探走向条件合作，曾假扮夫妻查案，互相救护后形成朋友承诺。尚未确立婚恋名分。"},{"people":[4,2],"tag":"菩提雪 · 正文","title":"柳慈音与白靖珩","intro":"幼时相识；柳慈音曾以白衣军首领为刺杀目标，后来获白靖珩救援和庇护。"},{"people":[4,3],"tag":"菩提雪 · 正文与设定","title":"柳慈音与荆如梦","intro":"从覆雨楼的考较者与新人成为同级竞争者。经历追杀与交手后，在医舍有过疗伤和急救配合，尚未建立同盟。"},{"people":[2,3],"tag":"菩提雪 · 正文","title":"白靖珩与荆如梦","intro":"追捕与对峙后，形成控制者与被俘者关系。近来有更多接触和观察，尚无合作、信任或感情承诺。"},{"people":[5,2],"tag":"菩提雪 · 正文","title":"萧无名与白靖珩","intro":"经救援、戒备和夜谈逐渐讨论合作，曾共同应对六阳局势；没有形成正式指挥隶属。"},{"people":[0,4],"tag":"菩提雪 · 前作经历","title":"兰栀宁与柳慈音","intro":"柳慈音救治常玉茹，使病情明显好转；兰栀宁深怀救母之恩，协助二人逃亡并在受审时守密。"},{"people":[0,3],"tag":"菩提雪 · 前作经历","title":"兰栀宁与荆如梦","intro":"荆如梦曾救下兰栀宁母女，也曾将母女作为逼柳慈音现身的诱饵。二人并未建立友谊或同盟。"},{"people":[0,1],"tag":"客来 · 作者规划","title":"兰栀宁与第五安","intro":"两人是《客来》的核心主角，关系将在客栈日常与单元事件中推进；尚无正文中的关系进展。"},{"people":[4],"tag":"菩提雪 · 师徒","title":"柳慈音与柳彦","intro":"柳彦收养柳慈音并授医，她长年为师父安危所牵制。她一度认定师父欺骗自己，旧案真相仍未查清。"},{"people":[4],"tag":"菩提雪 · 亲近之人","title":"柳慈音与白靖玟","intro":"白靖玟知她杀手身份仍愿认作妹妹，并在她养伤时照料、保护其秘密。"},{"people":[0],"tag":"客来 · 亲属设定","title":"兰栀宁的父母","intro":"父亲兰守谦，母亲常玉茹；《客来》时期二人留在六阳，未随她来到东望县。"},{"people":[1],"tag":"客来 · 亲属设定","title":"第五安与第五平","intro":"第五平是他的姐姐。她失踪后，第五安在游历作画之余持续寻找；他并不知晓作者设定中的最终真相。"}]}</script>

<script>
'use strict';
const names=['兰栀宁','第五安','白靖珩','荆如梦','柳慈音','萧无名'];
const categories=['人物志','势力志','山河志','纪事','作品'];
let library=JSON.parse(document.getElementById('library').textContent),person=4,tab='资料',variant='劲装',imageIndex=0,hover=0,lastFocus=null;
const app=document.getElementById('app'),overlay=document.getElementById('overlay'),file=document.getElementById('file');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function key(){return names[person]+'|'+(person===3?variant:'默认')+'|'+(tab==='表情'?'表情':'形象')}
function images(){return library[key()]||[]}
function route(){if(networkCleanup){networkCleanup();networkCleanup=null}if(chronicleCleanup){chronicleCleanup();chronicleCleanup=null}const parts=location.hash.slice(1).split('/');if(parts[0]==='people-network'){renderPeopleNetwork()}else if(parts[0]==='character'){renderWorldPerson(parts[1])}else if(parts[0]==='people'){const legacy=worldPersonByLegacy.get(Number(parts[1]))||worldPersonById.get('fanshi-liu-ciyin');history.replaceState(null,'','#'+personRoute(legacy));renderWorldPerson(legacy.id)}else if(parts[0]==='collection')renderCollection(Number(parts[1]),parts[2],parts[3]);else renderCover(parts[0]==='world'?'world':'home')}
function go(hash){if(location.hash==='#'+hash)route();else location.hash=hash}
const coverImages=JSON.parse(document.getElementById('cover-images').textContent);
const coverImageUrls=new Map();
function coverImageUrl(name){const value=coverImages[name];if(value.startsWith('assets/'))return value;if(!coverImageUrls.has(name)){const bytes=Uint8Array.from(atob(value),c=>c.charCodeAt(0));coverImageUrls.set(name,URL.createObjectURL(new Blob([bytes],{type:'image/webp'})))}return coverImageUrls.get(name)}
function setCoverImage(name){document.getElementById('scene').style.backgroundImage='url("'+coverImageUrl(name)+'")'}
function scene(){return '<div class="scene" id="scene" aria-hidden="true"></div>'}

const coverSelections=new Map();
function renderCover(page){hover=coverSelections.get(page)||0;const world=page==='world';app.innerHTML=scene()+`<div class="shell"><aside class="side"><div class="inner-identity"><button class="logo" data-go="home" aria-label="万相首页">万相</button><div class="inner-path">${world?'凡世 / 栏目':'万相 / 世界档案'}</div></div><nav class="nav" aria-label="${world?'凡世分类':'世界导航'}">${(world?categories:['凡世']).map((x,i)=>`<button data-cover="${i}" class="${i===hover?'active':''}"><span>0${i+1}</span>${x}</button>`).join('')}</nav><div class="sidefoot">${world?'<button data-go="home">← 返回万相</button>':'世界索引 / 01'}<br><button data-help>使用说明 ↗</button></div></aside><main class="cover"><div class="topline"><span>${world?'万相 / 凡世':'万相 · 世界档案'}</span>${world?'<button data-go="home" title="一键返回万相首页">← 万相首页</button>':'<span>LOCAL ARCHIVE · 001</span>'}</div><section class="hero"><div class="eyebrow" id="hero-eyebrow">${world?'FAN SHI / CHAPTER 01':'WORLD / 01'}</div><h1 id="hero-title">${world?'人物志':'凡世'}</h1><p id="hero-desc">${world?'六个人物，一页一相。':'于万相之间，进入一方世界。'}</p><button class="enter" id="enter">${world?'翻阅人物志':'进入凡世'}<span>↗</span></button></section><footer class="coverfooter"><span>点击左侧选择 · 右侧进入</span><span>凡世 · 画卷档案</span></footer></main></div>`;
const select=i=>{hover=i;setCoverImage(world?['characters','factions','geography','history','works'][i]:'cover');document.querySelectorAll('[data-cover]').forEach((b,j)=>b.classList.toggle('active',j===i));if(world){document.getElementById('hero-title').textContent=categories[i];document.getElementById('hero-eyebrow').textContent='FAN SHI / CHAPTER 0'+(i+1);document.getElementById('hero-desc').textContent=i===0?'六个人物，一页一相。':'翻阅凡世的'+categories[i]+'，寻见故事的来处。';document.getElementById('enter').innerHTML=(i===0?'翻阅人物志':'翻阅'+categories[hover])+'<span>↗</span>'}};
const enter=()=>{if(!world)go('world');else if(hover===0)go('people-network');else go('collection/'+hover+'/'+categoryDefault(hover))};
const coverButtons=[...document.querySelectorAll('[data-cover]')];coverButtons.forEach((button,i)=>{button.onclick=()=>{coverSelections.set(page,+button.dataset.cover);select(+button.dataset.cover)};button.onkeydown=e=>{let next;if(e.key==='ArrowDown')next=(i+1)%coverButtons.length;else if(e.key==='ArrowUp')next=(i-1+coverButtons.length)%coverButtons.length;else if(e.key==='Home')next=0;else if(e.key==='End')next=coverButtons.length-1;else return;e.preventDefault();coverButtons[next].focus()}});document.getElementById('enter').onclick=enter;select(hover);common()}
function innerIdentity(cat){return `<div class="inner-identity"><button class="logo" data-go="home" aria-label="万相首页">万相</button><div class="inner-path">凡世 / ${categories[cat]}</div></div>`}
function innerFooter(){return `<div class="inner-footer"><button data-return-up>← 返回上一级</button><button data-go="home">← 万相首页</button><div class="inner-tools"><button data-export>导出含图 HTML ↗</button><button data-help>使用说明 ↗</button></div></div>`}
function detailFrame({directory,visual,info,kind=''}){return `<div class="archive detail-view ${esc(kind)}"><div class="columns">${directory}${visual}${info}</div></div>`}
function renderPeople(){const imgs=images();if(imageIndex>=imgs.length)imageIndex=0;app.innerHTML=detailFrame({directory:characterDirectory(worldPersonByLegacy.get(person)),visual:`<main class="stage"><div class="stagebar"><span>CHARACTER / 0${[4,5,2,3,0,1].indexOf(person)+1}</span><span>${tab==='表情'?'EXPRESSION SHEET':'ORIGINAL IMAGE'}</span></div><div class="art">${imgs.length?`<img id="main-art" src="${imgs[imageIndex].src}" alt="${esc(names[person]+' · '+imgs[imageIndex].name)}">`:`<div class="blank-art"><span class="seal">${names[person]}</span><small>${tab==='表情'?'表情原图待载入':'人物原图待载入'}</small></div>`}</div><div class="stagefoot"><button id="prev" ${imgs.length<2?'disabled':''} aria-label="上一张">←</button><span class="counter">${imgs.length?String(imageIndex+1).padStart(2,'0')+' / '+String(imgs.length).padStart(2,'0'):'— / —'}</span><button id="next" ${imgs.length<2?'disabled':''} aria-label="下一张">→</button></div></main>`,info:`<aside class="dossier"><div class="micro">FAN SHI · CHARACTER DOSSIER</div><h1>${names[person]}</h1><span class="worldtag">凡世 / 人物档案 / 0${[4,5,2,3,0,1].indexOf(person)+1}</span><div class="tabs" role="tablist">${['资料','形象','表情','关联'].map(t=>`<button role="tab" aria-selected="${tab===t}" class="${tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('')}</div><div id="panel" role="tabpanel">${panel(imgs)}</div><div class="status">OFFLINE EDITION · 15</div></aside>`});
document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{imageIndex=0;variant='劲装';go('people/'+b.dataset.person)});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;imageIndex=0;renderPeople()});document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>{variant=b.dataset.variant;imageIndex=0;renderPeople()});document.querySelectorAll('[data-img]').forEach(b=>b.onclick=()=>{imageIndex=+b.dataset.img;renderPeople()});document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);const art=document.getElementById('main-art');if(art)art.onclick=()=>showImage(imgs[imageIndex]);const imp=document.getElementById('import');if(imp)imp.onclick=()=>{file.value='';file.click()};common();bindCharacterDirectory()}
function imagePanel(imgs){let variants=person===3?`<div class="variants" aria-label="荆如梦形象">${['劲装','女装'].map(v=>`<button data-variant="${v}" class="${v===variant?'active':''}">${v}</button>`).join('')}</div>`:'';if(tab==='资料')return `<div class="section-label">01 / 基础档案</div><dl><div class="field"><dt>姓名</dt><dd>${names[person]}</dd></div><div class="field"><dt>所属世界</dt><dd>凡世</dd></div>${person===3?'<div class="field"><dt>形象版本</dt><dd>劲装 / 女装</dd></div>':''}</dl><p class="quiet">其余档案待补充。</p>${variants}<button class="import" id="import">＋ 载入人物原图</button>`;if(tab==='关联')return '<div class="section-label">04 / 人物关联</div><p class="quiet">暂无已确认的关联资料。</p>';return `<div class="section-label">${tab==='形象'?'02 / 形象画廊':'03 / 表情图集'}</div>${variants}<p class="quiet">${tab==='形象'?'原图与画廊按完整比例展示。':'八宫格可整张载入，保留原始版式。'}<br>${imgs.length?'已载入 '+imgs.length+' 张图片。':'暂无图片。'}</p><button class="import" id="import">＋ 载入${tab==='表情'?'表情':'形象'}图片</button><div class="thumbs">${imgs.map((img,i)=>`<button data-img="${i}" class="${i===imageIndex?'active':''}" aria-label="查看${esc(img.name)}"><img src="${img.src}" alt="${esc(img.name)}"></button>`).join('')}</div>`}
function step(d){const len=images().length;if(len){imageIndex=(imageIndex+d+len)%len;renderPeople()}}
function openOverlay(){lastFocus=document.activeElement;overlay.classList.remove('hidden');document.querySelector('.close').focus()}
function showHelp(title,body){document.getElementById('overlay-content').innerHTML='<div class="help"><h2>'+esc(title)+'</h2><p>'+body+'</p></div>';openOverlay()}
function showImage(img){document.getElementById('overlay-content').innerHTML='<img src="'+img.src+'" alt="'+esc(img.name)+'">';document.getElementById('overlay-content').style.display='contents';openOverlay()}

// Data-driven concentric placement, followed by collision relaxation. No per-person coordinates.
function networkLayout(centerId,width,height){
 const connected=new Set(personEdges(centerId).map(e=>e.source===centerId?e.target:e.source));
 const near=worldPeople.filter(p=>connected.has(p.id)).sort((a,b)=>a.id.localeCompare(b.id));
 const far=worldPeople.filter(p=>p.id!==centerId&&!connected.has(p.id)).sort((a,b)=>a.id.localeCompare(b.id));
 const aspect=Math.max(1,Math.min(1.8,width/Math.max(350,height))),points={[centerId]:{x:0,y:0,r:61}};
 let ring=0;
 function place(list){let remaining=[...list];while(remaining.length){const radius=210+ring*185;const capacity=Math.max(6,Math.floor(2*Math.PI*radius*Math.sqrt((aspect*aspect+1)/2)/180));const members=remaining.splice(0,capacity);members.forEach((p,i)=>{const angle=-Math.PI/2+2*Math.PI*i/members.length+(ring%2?Math.PI/members.length:0);points[p.id]={x:Math.cos(angle)*radius*aspect,y:Math.sin(angle)*radius,r:40}});ring++;}}
 place(near);place(far);
 const anchors=JSON.parse(JSON.stringify(points)),ids=Object.keys(points);
 for(let iteration=0;iteration<140;iteration++){
  for(const id of ids){if(id===centerId)continue;points[id].x+=(anchors[id].x-points[id].x)*.025;points[id].y+=(anchors[id].y-points[id].y)*.025;}
  for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const a=points[ids[i]],b=points[ids[j]],dx=b.x-a.x,dy=b.y-a.y,distance=Math.hypot(dx,dy)||.01,min=ids[i]===centerId||ids[j]===centerId?180:164;if(distance>=min)continue;const push=(min-distance)*.52,ux=dx/distance,uy=dy/distance;if(ids[i]!==centerId){a.x-=ux*push;a.y-=uy*push}if(ids[j]!==centerId){b.x+=ux*push;b.y+=uy*push}}
 }
 return points;
}
function networkFitCamera(points,width,height){const values=Object.values(points),maxX=Math.max(...values.map(p=>Math.abs(p.x)+92)),maxY=Math.max(...values.map(p=>Math.abs(p.y)+104));const k=Math.min(1.15,(width-48)/(2*maxX),(height-170)/(2*maxY));return {x:width/2,y:100+(height-170)/2,k:Math.max(.12,k)}}
function renderPeopleNetwork(){
 if(networkCleanup){networkCleanup();networkCleanup=null}
 app.innerHTML=`<div class="network-shell"><aside class="network-sidebar">${innerIdentity(0)}<div class="network-selected" id="network-selected"></div><input id="network-search" class="network-search" type="search" placeholder="查找人物" aria-label="查找网络人物" value="${esc(networkState.query)}"><nav class="network-directory" aria-label="全部人物">${['putixue','kelai'].map(work=>`<h2>${workLabel(work)}</h2>${sidebarPeople(work).map(p=>`<button class="network-person-link" data-network-person="${p.id}">${esc(p.name)}</button>`).join('')}`).join('')}</nav>${innerFooter()}</aside><main id="network-canvas" class="network-canvas" tabindex="0" aria-label="人物关系网络，可拖动、滚轮缩放；Tab 选择头像，Enter 切换中心"><header class="network-heading"><div><div class="micro">FAN SHI · CHARACTERS</div><h1>人物关系网络</h1><p>单击头像，翻阅人物之间的联系</p></div><span class="network-count">${worldPeople.length} 人物 / ${worldRelations.length} 关系</span></header><div id="network-world" class="network-world"><svg id="network-edges" class="network-edges" aria-hidden="true">${worldRelations.map(e=>`<g class="network-edge" data-edge="${e.id}"><line/><text text-anchor="middle">${esc(e.label)}</text></g>`).join('')}</svg>${worldPeople.map(p=>{const photo=personPortrait(p);return `<button class="network-node" data-network-node="${p.id}" aria-label="选择${esc(p.name)}为中心"><span class="network-avatar">${photo?`<img src="${esc(pictureSrc(photo))}" alt="${esc(p.name)}" draggable="false">`:''}</span><span class="network-node-name">${esc(p.name)}</span></button>`}).join('')}</div><details class="network-connections" id="network-connections"><summary id="network-connections-title"></summary><div id="network-connection-list" class="network-connection-list"></div></details><div class="network-tools" aria-label="画布控制"><button id="network-out" aria-label="缩小">−</button><output id="network-zoom"></output><button id="network-in" aria-label="放大">＋</button><button id="network-fit">查看全部</button></div><div class="network-hint">拖动画布 · 滚轮缩放 · 查看档案进入详情</div></main></div>`;
 const canvas=document.getElementById('network-canvas'),world=document.getElementById('network-world'),nodeEls=new Map([...document.querySelectorAll('[data-network-node]')].map(n=>[n.dataset.networkNode,n]));
 const edgeEls=new Map([...document.querySelectorAll('[data-edge]')].map(n=>[n.dataset.edge,n]));
 let width=canvas.clientWidth,height=canvas.clientHeight,frame=0,disposed=false,drag=null,suppressUntil=0;
 if(!networkState.positions)networkState.positions=networkLayout(networkState.selected,width,height);
 if(!networkState.camera||!networkState.size||networkState.size[0]!==width||networkState.size[1]!==height)networkState.camera=networkFitCamera(networkState.positions,width,height);
 networkState.size=[width,height];
 function draw(){const cam=networkState.camera;world.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.k})`;document.getElementById('network-zoom').textContent=Math.round(cam.k*100)+'%';for(const [id,n] of nodeEls){const p=networkState.positions[id];n.style.transform=`translate(${p.x}px,${p.y}px)`;const avatar=n.querySelector('.network-avatar');avatar.style.width=avatar.style.height=p.r*2+'px';n.querySelector('.network-node-name').style.top=(72+p.r+14)+'px'}for(const e of worldRelations){const a=networkState.positions[e.source],b=networkState.positions[e.target],d=Math.hypot(b.x-a.x,b.y-a.y)||1,ux=(b.x-a.x)/d,uy=(b.y-a.y)/d,g=edgeEls.get(e.id),line=g.querySelector('line');line.setAttribute('x1',a.x+ux*(a.r+8));line.setAttribute('y1',a.y+uy*(a.r+8));line.setAttribute('x2',b.x-ux*(b.r+8));line.setAttribute('y2',b.y-uy*(b.r+8));const label=g.querySelector('text');label.setAttribute('x',(a.x+b.x)/2);label.setAttribute('y',(a.y+b.y)/2-8)}}
 function highlight(id){for(const e of worldRelations)edgeEls.get(e.id).classList.toggle('highlight',Boolean(id)&&(e.source===id||e.target===id)&&(e.source===networkState.selected||e.target===networkState.selected))}
 function updateSelection(){const p=worldPersonById.get(networkState.selected),edges=personEdges(p.id);document.getElementById('network-selected').innerHTML=`<h2>${esc(p.name)}</h2><p>${esc(p.role)}</p><button class="network-open" data-go="${personRoute(p)}">查看档案 <span>↗</span></button>`;document.getElementById('network-connections-title').textContent='当前人物 · '+edges.length+' 条已确认关系';document.getElementById('network-connection-list').innerHTML=edges.length?edges.map(e=>{const other=worldPersonById.get(e.source===p.id?e.target:e.source);return `<button data-network-related="${other.id}" title="${esc(e.note||e.label)}">${esc(other.name)}<small>${esc(e.label)}</small></button>`}).join(''):'<p>暂无已确认的人物连线。</p>';document.querySelectorAll('[data-network-related]').forEach(b=>{b.onclick=()=>select(b.dataset.networkRelated);b.onpointerenter=()=>highlight(b.dataset.networkRelated);b.onpointerleave=()=>highlight(null)});for(const [id,n] of nodeEls){const active=id===p.id;n.classList.toggle('active',active);n.setAttribute('aria-pressed',String(active))}document.querySelectorAll('[data-network-person]').forEach(b=>{b.classList.toggle('active',b.dataset.networkPerson===p.id);b.setAttribute('aria-pressed',String(b.dataset.networkPerson===p.id))});for(const e of worldRelations)edgeEls.get(e.id).classList.toggle('active',e.source===p.id||e.target===p.id);common()}
 function select(id){if(!worldPersonById.has(id)||id===networkState.selected)return;cancelAnimationFrame(frame);const start=JSON.parse(JSON.stringify(networkState.positions)),startCam={...networkState.camera},target=networkLayout(id,width,height);networkState.selected=id;const fitted=networkFitCamera(target,width,height),endCam=networkState.fit?fitted:{...fitted,k:startCam.k};updateSelection();highlight(null);const started=performance.now(),duration=matchMedia('(prefers-reduced-motion: reduce)').matches?0:580;function animate(now){if(disposed)return;const t=duration?Math.min(1,(now-started)/duration):1,u=t-1,ease=1+2.1*u*u*u+1.1*u*u;for(const key of Object.keys(target)){networkState.positions[key]={x:start[key].x+(target[key].x-start[key].x)*ease,y:start[key].y+(target[key].y-start[key].y)*ease,r:start[key].r+(target[key].r-start[key].r)*ease}}networkState.camera={x:startCam.x+(endCam.x-startCam.x)*ease,y:startCam.y+(endCam.y-startCam.y)*ease,k:startCam.k+(endCam.k-startCam.k)*Math.min(1,Math.max(0,ease))};draw();if(t<1)frame=requestAnimationFrame(animate)}frame=requestAnimationFrame(animate)}
 function zoom(factor,x=width/2,y=height/2){cancelAnimationFrame(frame);const cam=networkState.camera,k=Math.max(.12,Math.min(2.8,cam.k*factor)),ratio=k/cam.k;networkState.camera={x:x-(x-cam.x)*ratio,y:y-(y-cam.y)*ratio,k};networkState.fit=false;draw()}
 const search=document.getElementById('network-search');function filter(){networkState.query=search.value;const q=search.value.trim();document.querySelectorAll('[data-network-person]').forEach(b=>{const p=worldPersonById.get(b.dataset.networkPerson);b.hidden=![p.name,...p.aliases].some(s=>s.includes(q))})}search.oninput=filter;filter();
 document.querySelectorAll('[data-network-person]').forEach(b=>b.onclick=()=>select(b.dataset.networkPerson));for(const [id,n]of nodeEls){n.onclick=()=>{if(Date.now()>=suppressUntil)select(id)};n.onpointerenter=n.onfocus=()=>highlight(id);n.onpointerleave=n.onblur=()=>highlight(null)}
 canvas.addEventListener('wheel',e=>{if(e.target.closest('.network-connections,.network-tools'))return;e.preventDefault();const rect=canvas.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.0015),e.clientX-rect.left,e.clientY-rect.top)},{passive:false});
 canvas.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('.network-connections,.network-tools'))return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,camera:{...networkState.camera},moved:false};});
 canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.moved&&Math.hypot(dx,dy)<6)return;if(!drag.moved){cancelAnimationFrame(frame);drag.moved=true;canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging')}networkState.camera={...drag.camera,x:drag.camera.x+dx,y:drag.camera.y+dy};networkState.fit=false;draw()});
 function finish(){if(drag?.moved){suppressUntil=Date.now()+300;if(canvas.hasPointerCapture(drag.id))canvas.releasePointerCapture(drag.id)}drag=null;canvas.classList.remove('dragging')}
 canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);canvas.addEventListener('lostpointercapture',finish);canvas.addEventListener('pointerleave',()=>{if(drag&&!drag.moved)finish()});canvas.addEventListener('click',e=>{if(Date.now()<suppressUntil){e.preventDefault();e.stopImmediatePropagation()}},{capture:true});
 document.getElementById('network-in').onclick=()=>zoom(1.2);document.getElementById('network-out').onclick=()=>zoom(1/1.2);document.getElementById('network-fit').onclick=()=>{cancelAnimationFrame(frame);networkState.positions=networkLayout(networkState.selected,width,height);networkState.camera=networkFitCamera(networkState.positions,width,height);networkState.fit=true;draw()};
 canvas.addEventListener('keydown',e=>{if(e.target!==canvas)return;const step=45,cam=networkState.camera;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();cancelAnimationFrame(frame);cam.x+=e.key==='ArrowLeft'?step:e.key==='ArrowRight'?-step:0;cam.y+=e.key==='ArrowUp'?step:e.key==='ArrowDown'?-step:0;networkState.fit=false;draw()}if(e.key==='+'||e.key==='='){e.preventDefault();zoom(1.2)}if(e.key==='-'){e.preventDefault();zoom(1/1.2)}if(e.key==='0'){e.preventDefault();document.getElementById('network-fit').click()}});
 const observer=new ResizeObserver(()=>{if(disposed||!canvas.clientWidth)return;const w=canvas.clientWidth,h=canvas.clientHeight;if(w===width&&h===height)return;cancelAnimationFrame(frame);width=w;height=h;networkState.size=[w,h];networkState.positions=networkLayout(networkState.selected,w,h);networkState.camera=networkFitCamera(networkState.positions,w,h);networkState.fit=true;draw()});observer.observe(canvas);
 networkCleanup=()=>{disposed=true;cancelAnimationFrame(frame);observer.disconnect();finish()};updateSelection();draw();
}
